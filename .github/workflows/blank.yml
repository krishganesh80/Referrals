name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` input on purpose: package.json carries `packageManager`, and
      # pnpm/action-setup fails with "Multiple versions of pnpm specified" if both are given.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The golden files are the regression net for the whole product: exact ordering and exact
      # reason strings over 20 criteria sets against both a verified-shaped directory and an
      # 80%-unknown one. A wording change is a product change and has to show up in a diff.
      - name: Test
        run: pnpm test

      - name: Install a browser for the egress test
        run: pnpm --filter @referral/web exec playwright install --with-deps chromium

      # Constraint 2 is only worth as much as the evidence for it: this records every network
      # event the page produces during a match and fails on any host but the bundle origin.
      - name: End-to-end
        run: pnpm e2e
